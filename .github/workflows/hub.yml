name: Hub APK

# Fork Iguinhowill: compila a variante hub (só sono, passos e FC em repouso, hub/README.md),
# confere as permissões e, na main, assina e publica o APK numa release (a mais recente vira
# releases/latest).
#
# A chave nunca encosta no Gradle. O job "apk" roda o build do original, que numa PR de
# sincronização ainda não foi revisado, sem secret nenhum e com o token só de leitura. Só o job
# "publicar" lê a chave, e só na main: os secrets moram no environment "assinatura", que libera
# apenas a branch main (hub/criar-chave.sh configura). Ele assina com o apksigner do SDK o APK que
# o "apk" deixou como artefato.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Na main não cancela: um run interrompido no meio deixaria a publicação pela metade.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash # com pipefail, ao contrário do padrão do runner

jobs:
  apk:
    if: github.repository == 'Iguinhowill/life-dashboard-companion-app'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      # Mesmo ajuste do build.yml: com os 2 GB do gradle.properties o D8 fica sem memória.
      - name: Give the Gradle daemon more heap
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties

      - name: Build hub APK (unsigned)
        run: |
          chmod +x gradlew
          ./gradlew assembleHub

      - name: Find the APK
        id: apk
        run: |
          apk=app/build/outputs/apk/hub/app-hub-unsigned.apk
          if [ ! -f "$apk" ]; then
            ls -R app/build/outputs/apk || true
            echo "::error::Não achei $apk."
            exit 1
          fi
          sha256sum "$apk"
          echo "path=$apk" >> "$GITHUB_OUTPUT"

      - name: Check permissions
        env:
          APK: ${{ steps.apk.outputs.path }}
        run: bash hub/conferir-permissoes.sh "$APK"

      # O mapping do R8 vai junto: sem ele, o stack trace de um crash do APK publicado é ilegível.
      - name: Upload APK and R8 mapping
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hub-apk
          path: |
            app/build/outputs/apk/hub/app-hub-unsigned.apk
            app/build/outputs/mapping/hub/mapping.txt
          if-no-files-found: error
          retention-days: 30

  publicar:
    needs: apk
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: assinatura
    permissions:
      contents: write # criar a release

    steps:
      # Só os scripts de hub/, da main já revisada.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: hub

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hub-apk
          path: artefato

      - name: Sign
        env:
          KEYSTORE_FILE_BASE64: ${{ secrets.KEYSTORE_FILE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_FILE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Faltam os secrets do environment assinatura. Rode hub/criar-chave.sh."
            exit 1
          fi
          bt="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          printf '%s' "$KEYSTORE_FILE_BASE64" | base64 --decode > "$RUNNER_TEMP/chave.p12"
          # O AGP já entrega o APK alinhado, com as .so em páginas de 16 KB. Só realinha se não
          # estiver, e com -P 16, para não rebaixar para 4 KB.
          sem_assinatura=artefato/apk/hub/app-hub-unsigned.apk
          if "${bt}zipalign" -c -P 16 4 "$sem_assinatura" > /dev/null; then
            cp "$sem_assinatura" "$RUNNER_TEMP/alinhado.apk"
          else
            "${bt}zipalign" -P 16 -f 4 "$sem_assinatura" "$RUNNER_TEMP/alinhado.apk"
          fi
          "${bt}apksigner" sign \
            --ks "$RUNNER_TEMP/chave.p12" --ks-type PKCS12 --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --out hub-saude.apk "$RUNNER_TEMP/alinhado.apk"
          "${bt}apksigner" verify --print-certs hub-saude.apk | grep -v '^WARNING'

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/chave.p12"

      - name: Check permissions of the signed APK
        run: bash hub/conferir-permissoes.sh hub-saude.apk

      # Uma release nova por build, marcada como a mais recente, em vez de mover uma tag: o link
      # fixo releases/latest/download/hub-saude.apk passa de uma para a outra de uma vez, sem
      # janela sem APK, e cada versão guarda o próprio mapping. Tags hub-N não casam com o
      # padrão X.Y.Z do release.yml. Ficam as 5 últimas.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bt="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          versao="$("${bt}aapt2" dump badging hub-saude.apk | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)"
          sha="$(sha256sum hub-saude.apk | cut -d' ' -f1)"
          cp artefato/mapping/hub/mapping.txt mapping-hub.txt
          tag="hub-$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          notas="APK da variante hub, compilado do commit $GITHUB_SHA. SHA-256: \`$sha\`. Instalação e atualização em hub/README.md."
          gh release create "$tag" hub-saude.apk mapping-hub.txt --latest \
            --target "$GITHUB_SHA" --title "Hub Saúde $versao ($tag)" --notes "$notas" \
            --repo "$GITHUB_REPOSITORY"
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("hub-"))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' \
            | while read -r antiga; do
                gh release delete "$antiga" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY"
              done
